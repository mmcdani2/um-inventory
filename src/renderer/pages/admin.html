<div class="page">
  <div class="page-head">
    <div>
      <h2>Admin</h2>
      <div class="hint">Restricted tools.</div>
    </div>
  </div>

  <div class="card-block">
    <div class="quick-grid" style="gap: 10px">
      <div>
        <div class="lbl">Import Locations CSV</div>

        <!-- hide native input, use styled button -->
        <input
          id="locCsvFile"
          type="file"
          accept=".csv"
          style="display: none"
        />

        <div
          style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap"
        >
          <label for="locCsvFile" class="btn">Choose CSV</label>
          <div id="locCsvName" class="msg" style="margin: 0; opacity: 0.9">
            No file selected
          </div>
        </div>

        <div style="margin-top: 10px">
          <button id="btnImportLocCsv" class="btn btn-primary" disabled>
            Import Locations
          </button>
        </div>
      </div>

      <div>
        <div class="lbl">Bulk Receive Seeder</div>
        <div class="hint">Creates receive batches to populate balances.</div>

        <label class="field">
          <div class="lbl">Batches</div>
          <input
            id="seedBatches"
            class="input input-mini"
            type="number"
            min="1"
            value="10"
          />
        </label>

        <label class="field">
          <div class="lbl">Lines per batch</div>
          <input
            id="seedLines"
            class="input input-mini"
            type="number"
            min="1"
            value="8"
          />
        </label>

        <label class="field">
          <div class="lbl">Max qty per line</div>
          <input
            id="seedMaxQty"
            class="input input-mini"
            type="number"
            min="1"
            value="5"
          />
        </label>

        <button id="btnSeedReceive" class="btn">Seed Receives</button>
      </div>
    </div>

    <div id="adminToolsMsg" class="msg"></div>
  </div>

  <div class="card-block">
    <div class="card-title">Danger Zone</div>
    <div class="quick-grid">
      <button id="btnResetDb" class="btn btn-danger">
        Reset Database (wipe data)
      </button>
    </div>
    <div id="adminMsg" class="msg"></div>
  </div>
</div>
