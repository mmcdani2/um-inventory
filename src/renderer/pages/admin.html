<div class="page">
  <div class="page-head">
    <div>
      <h2>Admin</h2>
      <div class="hint">Restricted tools.</div>
    </div>
  </div>

  <div class="card-block">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <!-- Locations -->
      <div>
        <div class="lbl">Locations CSV</div>
        <input
          id="locCsvFile"
          type="file"
          accept=".csv"
          style="display: none"
        />

        <div
          style="
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 8px;
          "
        >
          <label for="locCsvFile" class="btn">Choose CSV</label>
          <div
            id="locCsvName"
            class="msg"
            style="margin: 0; opacity: 0.9; min-width: 160px"
          >
            No file selected
          </div>
          <button id="btnImportLocCsv" class="btn btn-primary" disabled>
            Import
          </button>
        </div>
      </div>

      <!-- Receives -->
      <div>
        <div class="lbl">Bulk Receives CSV</div>
        <input
          id="recvCsvFile"
          type="file"
          accept=".csv"
          style="display: none"
        />

        <div
          style="
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 8px;
          "
        >
          <label for="recvCsvFile" class="btn">Choose CSV</label>
          <div
            id="recvCsvName"
            class="msg"
            style="margin: 0; opacity: 0.9; min-width: 160px"
          >
            No file selected
          </div>

          <button id="btnImportRecvCsv" class="btn btn-primary" disabled>
            Import
          </button>

          <label
            class="msg"
            style="
              margin: 0;
              display: flex;
              align-items: center;
              gap: 8px;
              user-select: none;
              opacity: 0.9;
            "
          >
            <input id="recvAutoCreate" type="checkbox" checked />
            Auto-create missing
          </label>
        </div>
      </div>

      <div id="adminToolsMsg" class="msg"></div>
    </div>
  </div>

  <div class="card-block">
    <div class="card-title">Danger Zone</div>
    <div class="quick-grid">
      <button id="btnResetDb" class="btn btn-danger">
        Reset Database (wipe data)
      </button>
    </div>
    <div id="adminMsg" class="msg"></div>
  </div>
</div>
