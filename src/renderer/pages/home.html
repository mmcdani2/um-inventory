<div class="page">
  <div class="page-head">
    <div>
      <div class="page-title">Home</div>
      <div class="page-sub">Setup: create bins/locations (shop, trucks, warehouse)</div>
    </div>
  </div>

  <div class="card slim">
    <div class="card-title">Add Location</div>

    <div class="form-grid">
      <label class="field">
        <div class="lbl">Code *</div>
        <input id="lCode" class="input" placeholder="e.g. SHOP-A1 or TRUCK-01" />
      </label>

      <label class="field span-2">
        <div class="lbl">Name</div>
        <input id="lName" class="input" placeholder="e.g. Main shop bin A1" />
      </label>
    </div>

    <div class="row">
      <button id="lAdd" class="btn btn-primary">Add Location</button>
      <div id="lMsg" class="msg"></div>
    </div>
  </div>

  <div class="table-wrap">
    <table class="table" id="locTable">
      <thead>
        <tr>
          <th>Code</th>
          <th>Name</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="hint" id="locHint"></div>
</div>
