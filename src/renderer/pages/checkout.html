<div class="page checkout-page">

  <div class="card slim checkout-card">


    <div class="form-grid">
      <label class="field">
        <div class="lbl">Job # *</div>
        <input id="cJob" class="input" />
      </label>

      <label class="field">
        <div class="lbl">Tech *</div>
        <input id="cTech" class="input" />
      </label>

      <label class="field">
        <div class="lbl">Location *</div>
        <select id="cLoc" class="input"></select>
      </label>

      <label class="field span-2">
        <div class="lbl">Item *</div>
        <input id="cItemSearch" class="input" placeholder="Scan barcode or type SKU/description..."
          autocomplete="off" />
        <div id="cItemResults" class="picklist hidden"></div>
        <select id="cItem" class="input hidden"></select>
      </label>

      <label class="field">
        <div class="lbl">Qty *</div>
        <input id="cQty" class="input" type="number" step="1" value="1" />
      </label>

      <label class="field span-2">
        <div class="lbl">Notes</div>
        <textarea id="cNotes" class="input" rows="3" placeholder="notes..."></textarea>
      </label>
    </div>

    <div class="row">
      <button id="cSubmit" class="btn btn-primary">Checkout</button>
      <div id="cMsg" class="msg"></div>
    </div>
  </div>
</div>
