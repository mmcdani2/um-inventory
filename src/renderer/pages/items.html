<div class="page">
  <div class="page-head">
    <div>
      <div class="page-title">Items</div>
      <div class="page-sub">Catalog</div>
    </div>

    <div class="page-actions">
      <button id="btnAddRow" class="btn btn-primary">Add Item</button>
      <button id="itemsRefresh" class="btn">Refresh</button>

      <div class="menu">
        <button id="btnMenu" class="btn">⋯</button>
        <div id="menuPanel" class="menu-panel hidden">
          <button id="btnImportCsv" class="menu-item">Import CSV</button>
          <button id="btnTemplateCsv" class="menu-item">Download CSV Template</button>
        </div>
      </div>
    </div>
  </div>

  <!-- IMPORTANT: items-wrap disables horizontal scroll -->
  <div class="table-wrap items-wrap">
    <table class="table" id="itemsTable">
      <colgroup>
        <col style="width:11%" />  <!-- Category -->
        <col style="width:12%" />  <!-- SKU -->
        <col style="width:24%" />  <!-- Description -->
        <col style="width:6%"  />  <!-- Unit -->
        <col style="width:7%"  />  <!-- On Hand -->
        <col style="width:8%"  />  <!-- Reorder Pt -->
        <col style="width:8%"  />  <!-- Reorder Qty -->
        <col style="width:8%"  />  <!-- Cost -->
        <col style="width:16%" />  <!-- Actions -->
      </colgroup>

      <thead>
        <tr>
          <th>Category</th>
          <th>SKU / Part #</th>
          <th>Description</th>
          <th class="c">Unit</th>
          <th class="c">On Hand</th>
          <th class="c">Reorder Pt</th>
          <th class="c">Reorder Qty</th>
          <th class="c">Cost</th>
          <th class="c">Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="hint" id="itemsHint"></div>
  <div class="msg" id="itemsMsg"></div>

  <input id="csvFile" type="file" accept=".csv,text/csv" style="display:none" />
</div>
