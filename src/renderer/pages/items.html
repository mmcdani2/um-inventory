<div class="page">
  <div class="page-head">
    <div>
      <div class="items-search">
        <input
          id="itemsSearch"
          class="input"
          type="search"
          placeholder="Search items…"
          autocomplete="off"
        />
        <button id="itemsSearchClear" class="btn btn-ghost" type="button">
          Clear
        </button>
      </div>
    </div>

    <div class="page-actions">
      <button id="btnAddRow" class="btn btn-primary">Add Item</button>
      <button id="itemsRefresh" class="btn">Refresh</button>

      <div class="menu">
        <button id="btnMenu" class="btn">⋯</button>
        <div id="menuPanel" class="menu-panel hidden">
          <button id="btnImportCsv" class="menu-item">Import CSV</button>
          <button id="btnTemplateCsv" class="menu-item">
            Download CSV Template
          </button>
          <button id="btnExportItemsCsv" class="menu-item">
            Export Items Snapshot CSV
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- IMPORTANT: items-wrap disables horizontal scroll -->
  <div class="table-wrap items-wrap">
    <table class="table" id="itemsTable">
      <colgroup>
        <col style="width: 12%" /> <!-- Category -->
        <col style="width: 14%" /> <!-- Barcode -->
        <col style="width: 14%" /> <!-- SKU -->
        <col style="width: 22%" /> <!-- Description -->
        <col style="width: 6%" />  <!-- Unit -->
        <col style="width: 6%" />  <!-- OH -->
        <col style="width: 6%" />  <!-- Par -->
        <col style="width: 8%" />  <!-- Restock -->
        <col style="width: 6%" />  <!-- Cost -->
        <col style="width: 16%" /> <!-- Actions -->
      </colgroup>

      <thead>
        <tr>
          <th>CATEGORY</th>
          <th>BARCODE</th>
          <th>SKU / PART #</th>
          <th>DESCRIPTION</th>
          <th class="c">UNIT</th>
          <th class="c">OH</th>
          <th class="c">PAR</th>
          <th class="c">RESTOCK</th>
          <th class="c">COST</th>
          <th class="c">ACTIONS</th>
        </tr>
      </thead>

      <tbody></tbody>
    </table>
  </div>

  <div class="msg" id="itemsMsg"></div>

  <input id="csvFile" type="file" accept=".csv,text/csv" style="display:none" />
</div>
