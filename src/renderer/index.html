<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Urban Inventory</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="dot"></div>
          <div>
            <div class="title">Urban Inventory</div>
          </div>
        </div>

        <div class="actions">
          <button id="btnSidebarToggle" class="btn" title="Toggle sidebar">☰</button>
          <button id="btnRefresh" class="btn">Refresh</button>
        </div>
      </header>

      <div id="drawerScrim" class="drawer-scrim hidden"></div>

      <div class="layout">
        <aside class="sidebar">
          <div class="nav-title">Navigation</div>
          <nav id="nav" class="nav"></nav>

          <div class="sidebar-footer">
            <div class="side-k">DB</div>
            <div class="side-v mono" id="dbPath">—</div>
            <div class="side-k">Schema</div>
            <div class="side-v mono" id="schemaVersion">—</div>
          </div>
        </aside>

        <main class="main">
          <!-- Full-bleed view. The page itself controls its own scrolling. -->
          <div id="view" class="view"></div>
        </main>
      </div>

      <footer class="footer">
        <span class="muted">Copyright @ Urban Mechanical 2026</span>
      </footer>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
