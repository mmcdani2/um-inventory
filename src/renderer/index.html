<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UM Inventory (MVP)</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="dot"></div>
          <div>
            <div class="title">Urban Inventory</div>
            <div class="sub">Receive • Release • Reconcile</div>
          </div>
        </div>

        <div class="actions">
          <button id="btnRefresh" class="btn">Refresh</button>
        </div>
      </header>

      <div class="shell">
        <aside class="sidebar">
          <div class="nav-title">Navigation</div>
          <nav id="nav" class="nav"></nav>

          <div class="side-card">
            <div class="side-k">DB</div>
            <div class="side-v mono" id="dbPath">—</div>
            <div class="side-k">Schema</div>
            <div class="side-v mono" id="schemaVersion">—</div>
          </div>
        </aside>

        <main class="content">
          <div id="view" class="view card"></div>
        </main>
      </div>

      <footer class="footer">
        <span class="muted">MVP build — local-first</span>
      </footer>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
